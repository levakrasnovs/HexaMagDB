<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html, body { margin:0; background:transparent; overflow:hidden; } .pt a { cursor:pointer; }</style>
<style id="css"></style></head>
<body><div id="root"></div>
<script>
// Streamlit component protocol without the npm library: render args in, clicked query string out
const send = (type, data) => parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
const fit = () => send("streamlit:setFrameHeight", {height: document.documentElement.scrollHeight});
let nonce = 0;
window.addEventListener("message", e => {
  if (e.data.type !== "streamlit:render") return;
  document.getElementById("css").textContent = e.data.args.css;
  document.getElementById("root").innerHTML = e.data.args.html;
  fit();
});
document.addEventListener("click", e => {
  const a = e.target.closest("[data-q]");
  if (!a) return;
  e.preventDefault();
  send("streamlit:setComponentValue", {value: {q: a.dataset.q, n: ++nonce}, dataType: "json"});
});
new ResizeObserver(fit).observe(document.body);
send("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
